name: Build & Release

on:
  push:
    branches:
      - go
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: 192.168.123.128:3001

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        run: |
          git clone http://gitea-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#http*://}/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Login to Gitea Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login $REGISTRY -u $GITHUB_ACTOR --password-stdin

      - name: Build and push CPU image
        run: |
          IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}
          docker build -f Dockerfile -t $IMAGE:latest -t $IMAGE:cpu .
          docker push $IMAGE:latest
          docker push $IMAGE:cpu

      - name: Build and push GPU image
        run: |
          IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}
          docker build -f Dockerfile.gpu -t $IMAGE:gpu .
          docker push $IMAGE:gpu

      - name: Build and push Intel GPU image
        run: |
          IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}
          docker build -f Dockerfile.intel --build-arg USE_INTEL_REPO=0 --build-arg USE_JELLYFIN_FFMPEG=0 -t $IMAGE:intel .
          docker push $IMAGE:intel

  windows-release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        run: |
          git clone http://gitea-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#http*://}/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Build Windows package
        run: |
          docker build -f Dockerfile.windows-release -t fft-windows-release:$GITHUB_SHA .
          container_id=$(docker create fft-windows-release:$GITHUB_SHA /bin/sh)
          docker cp "$container_id:/out/FFT-windows-x64-lite.zip" ./FFT-windows-x64-lite.zip
          docker rm "$container_id"
          ls -lh FFT-windows-x64-lite.zip

      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          release_json=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","body":"Windows x64 release package generated by Gitea Actions.","draft":false,"prerelease":false}' "$tag" "$GITHUB_SHA" "$tag")
          response=$(curl -fsS \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$release_json" \
            "$api/releases" || true)
          release_id=$(printf '%s' "$response" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$release_id" ]; then
            response=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" "$api/releases/tags/$tag")
            release_id=$(printf '%s' "$response" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1)
          fi
          if [ -z "$release_id" ]; then
            echo "Could not determine release id for $tag"
            exit 1
          fi
          curl -fsS \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@FFT-windows-x64-lite.zip" \
            "$api/releases/$release_id/assets?name=FFT-windows-x64-lite.zip"
