name: Build & Release

on:
  push:
    branches: [go]
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: limbuntu/fft-go

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        run: |
          IMAGE=$REGISTRY/${IMAGE_NAME,,}
          docker build -f Dockerfile -t $IMAGE:latest -t $IMAGE:cpu .
          docker push $IMAGE:latest
          docker push $IMAGE:cpu

      - name: Build and push GPU image
        run: |
          IMAGE=$REGISTRY/${IMAGE_NAME,,}
          docker build -f Dockerfile.gpu -t $IMAGE:gpu .
          docker push $IMAGE:gpu

      - name: Build and push Intel GPU image
        run: |
          IMAGE=$REGISTRY/${IMAGE_NAME,,}
          docker build -f Dockerfile.intel -t $IMAGE:intel .
          docker push $IMAGE:intel

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build

      - name: Build backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FFT | Out-Null
          go build -trimpath -ldflags="-s -w -X github.com/limbuntu/fft/internal/config.defaultOpenBrowser=true" -o dist/FFT/FFT.exe ./cmd/server
          Copy-Item -Recurse frontend/dist dist/FFT/frontend/dist
          Copy-Item bench_leaderboard.json dist/FFT/

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile ffmpeg-dl.7z
          7z x ffmpeg-dl.7z -offmpeg-tmp
          $ffmpeg = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination "dist/FFT/ffmpeg.exe"
          Copy-Item $ffprobe.FullName -Destination "dist/FFT/ffprobe.exe"

      - name: Package full
        shell: pwsh
        run: Compress-Archive -Path "dist/FFT/*" -DestinationPath "FFT-windows-x64-full.zip"

      - name: Package lite
        shell: pwsh
        run: |
          Remove-Item "dist/FFT/ffmpeg.exe", "dist/FFT/ffprobe.exe"
          Compress-Archive -Path "dist/FFT/*" -DestinationPath "FFT-windows-x64-lite.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            FFT-windows-x64-lite.zip
            FFT-windows-x64-full.zip

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            artifact: FFT-macos-arm64.tar.gz
          - goarch: amd64
            artifact: FFT-macos-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build

      - name: Build backend
        run: |
          mkdir -p dist/FFT/frontend
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w -X github.com/limbuntu/fft/internal/config.defaultOpenBrowser=true" -o dist/FFT/FFT ./cmd/server
          cp -R frontend/dist dist/FFT/frontend/dist
          cp bench_leaderboard.json dist/FFT/

      - name: Codesign binary
        run: codesign --force --sign - dist/FFT/FFT

      - name: Package
        run: |
          cd dist && tar czf ../${{ matrix.artifact }} FFT/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.goarch }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/FFT-windows-x64-lite.zip
            artifacts/FFT-windows-x64-full.zip
            artifacts/FFT-macos-arm64.tar.gz
            artifacts/FFT-macos-x64.tar.gz
